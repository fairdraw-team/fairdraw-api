spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 3
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://svarsetejqotluqikbtm.supabase.co/auth/v1
          jwk-set-uri: https://svarsetejqotluqikbtm.supabase.co/auth/v1/.well-known/jwks.json
          jws-algorithms: ES256

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
  portone:
    api-secret: ${PORTONE_API_SECRET:}
    webhook-secret: ${PORTONE_WEBHOOK_SECRET:}
    store-id: ${PORTONE_STORE_ID:}
    channel-key: ${PORTONE_CHANNEL_KEY:}
  cron-secret: ${CRON_SECRET:}
  succession-pay-minutes: ${SUCCESSION_PAY_MINUTES:1440}

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework