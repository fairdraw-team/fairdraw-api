spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 3
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://svarsetejqotluqikbtm.supabase.co/auth/v1
          jwk-set-uri: https://svarsetejqotluqikbtm.supabase.co/auth/v1/.well-known/jwks.json
          jws-algorithms: ES256

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework